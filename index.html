<!doctype html>
<html lang="sk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Google Translate TTS answers 404 to requests that carry a Referer header. -->
		<meta name="referrer" content="no-referrer" />
		<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Napíš text a nechaj ho prehovoriť nahlas po slovensky." />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Speechless" />
		<title>Speechless</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icon.svg" type="image/svg+xml" />
		<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
		<!-- iOS ignores the manifest icons when adding to the home screen. -->
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<!-- build.mjs rewrites this to the content-hashed file name. -->
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="app">
			<form class="composer" id="form">
				<textarea
					class="composer-input"
					id="input"
					rows="3"
					autofocus
					autocomplete="off"
					autocapitalize="sentences"
					enterkeyhint="send"
					placeholder="Napíš, čo mám povedať…"
					aria-label="Text na prehratie"
				></textarea>
				<button class="composer-submit" type="submit">Prehrať</button>
				<p class="status" id="status" role="status" aria-live="polite"></p>
			</form>

			<section class="history" aria-labelledby="history-heading">
				<header class="history-header">
					<h2 class="history-heading" id="history-heading">História</h2>
					<button class="history-clear" id="clear-history" type="button" hidden>Vymazať</button>
				</header>
				<p class="history-empty" id="history-empty">Zatiaľ nič nebolo prehraté.</p>
				<ul class="history-list" id="history"></ul>
			</section>

			<section class="settings" aria-labelledby="settings-heading">
				<h2 class="settings-heading" id="settings-heading">Nastavenia</h2>
				<label class="settings-row" for="language">
					<span>Jazyk reči</span>
					<select class="settings-select" id="language"></select>
				</label>
			</section>
		</main>

		<script src="main.js"></script>
	</body>
</html>

<!doctype html>
<html lang="sk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#101418" />
		<meta name="description" content="Napíš text a nechaj ho prehovoriť nahlas po slovensky." />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<title>Speechless</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="app">
			<form class="composer" id="form">
				<textarea
					class="composer-input"
					id="input"
					rows="3"
					autofocus
					autocomplete="off"
					autocapitalize="sentences"
					enterkeyhint="send"
					placeholder="Napíš, čo mám povedať…"
					aria-label="Text na prehratie"
				></textarea>
				<button class="composer-submit" type="submit">Prehrať</button>
				<p class="status" id="status" role="status" aria-live="polite"></p>
			</form>

			<section class="history" aria-labelledby="history-heading">
				<header class="history-header">
					<h2 class="history-heading" id="history-heading">História</h2>
					<button class="history-clear" id="clear-history" type="button" hidden>Vymazať</button>
				</header>
				<p class="history-empty" id="history-empty">Zatiaľ nič nebolo prehraté.</p>
				<ul class="history-list" id="history"></ul>
			</section>
		</main>

		<script src="main.js"></script>
	</body>
</html>

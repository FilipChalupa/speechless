<!doctype html>
<!-- Texts start in English; main.js switches them to the chosen speech language. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Google Translate TTS answers 404 to requests that carry a Referer header. -->
		<meta name="referrer" content="no-referrer" />
		<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Type a message and let the phone say it out loud." />
		<link rel="canonical" href="https://speechless.filipchalupa.cz/" />
		<!-- Link previews (Slack, Facebook, iMessage, X). The image URL has to be
		     absolute; make-og-image.mjs regenerates the picture. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Speechless" />
		<meta property="og:title" content="Speechless" />
		<meta property="og:description" content="Type a message and let the phone say it out loud." />
		<meta property="og:url" content="https://speechless.filipchalupa.cz/" />
		<meta property="og:image" content="https://speechless.filipchalupa.cz/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="A white speech bubble on blue next to the name Speechless." />
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="cs_CZ" />
		<meta property="og:locale:alternate" content="sk_SK" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Speechless" />
		<title>Speechless</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icon.svg" type="image/svg+xml" />
		<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
		<!-- iOS ignores the manifest icons when adding to the home screen. -->
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<!-- build.mjs rewrites this to the content-hashed file name. -->
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="app">
			<form class="composer" id="form">
				<textarea
					class="composer-input"
					id="input"
					rows="3"
					autofocus
					autocomplete="off"
					autocapitalize="sentences"
					enterkeyhint="send"
					placeholder="Type what I should say…"
					aria-label="Text to speak"
				></textarea>
				<div class="composer-actions">
					<button class="composer-submit" id="submit" type="submit">Play</button>
					<button class="composer-show" id="show" type="button">Show</button>
				</div>
				<p class="status" id="status" role="status" aria-live="polite"></p>
			</form>

			<section class="history" aria-labelledby="history-heading">
				<header class="history-header">
					<h2 class="history-heading" id="history-heading">History</h2>
					<button class="history-clear" id="clear-history" type="button" hidden>Clear</button>
				</header>
				<p class="history-empty" id="history-empty">Nothing has been spoken yet.</p>
				<ul class="history-list" id="history"></ul>
			</section>

			<nav class="footer">
				<!-- The gear is for whoever cannot read the current language: the
				     language switch is behind this very link. -->
				<a class="footer-link" id="settings-link" href="settings.html">
					<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/>
					</svg>
					<span id="settings-label">Settings</span>
				</a>
				<!-- main.js points this at the section in the interface language. -->
				<a class="footer-link" id="privacy-link" href="privacy.html">Privacy</a>
			</nav>
		</main>

		<!-- Shown full screen when speaking is not enough: noise, or someone
		     who cannot hear well. -->
		<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Shown text" hidden>
			<p class="overlay-text" id="overlay-text"></p>
			<div class="overlay-actions">
				<button class="overlay-speak" id="overlay-speak" type="button">Play</button>
				<button class="overlay-close" id="overlay-close" type="button">Close</button>
			</div>
		</div>

		<script src="main.js"></script>
	</body>
</html>

<!doctype html>
<!-- Texts start in English; main.js switches them to the chosen speech language. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Google Translate TTS answers 404 to requests that carry a Referer header. -->
		<meta name="referrer" content="no-referrer" />
		<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Type a message and let the device say it out loud." />
		<link rel="canonical" href="https://filipchalupa.cz/speechless/" />
		<!-- Link previews (Slack, Facebook, iMessage, X). The image URL has to be
		     absolute; make-og-image.mjs regenerates the picture. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Speechless" />
		<meta property="og:title" content="Speechless" />
		<meta property="og:description" content="Type a message and let the device say it out loud." />
		<meta property="og:url" content="https://filipchalupa.cz/speechless/" />
		<meta property="og:image" content="https://filipchalupa.cz/speechless/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="A white speech bubble on blue next to the name Speechless." />
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="cs_CZ" />
		<meta property="og:locale:alternate" content="sk_SK" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Speechless" />
		<title>Speechless</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icon.svg" type="image/svg+xml" />
		<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
		<!-- iOS ignores the manifest icons when adding to the home screen. -->
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<!-- build.mjs rewrites this to the content-hashed file name. -->
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="app">
			<form class="composer" id="form">
				<textarea
					class="composer-input"
					id="input"
					rows="3"
					autofocus
					autocomplete="off"
					autocapitalize="sentences"
					enterkeyhint="send"
					placeholder="Type what I should say…"
					aria-label="Text to speak"
				></textarea>
				<div class="composer-actions">
					<button class="composer-submit" id="submit" type="submit">Play</button>
					<button class="composer-show" id="show" type="button">Show</button>
				</div>
				<p class="status" id="status" role="status" aria-live="polite"></p>
			</form>

			<section class="history" aria-labelledby="history-heading">
				<header class="history-header">
					<h2 class="history-heading" id="history-heading">History</h2>
					<button class="history-clear" id="clear-history" type="button" hidden>Clear</button>
				</header>
				<p class="history-empty" id="history-empty">Nothing has been spoken yet.</p>
				<ul class="history-list" id="history"></ul>
			</section>

			<section class="settings" aria-labelledby="settings-heading">
				<h2 class="settings-heading" id="settings-heading">Settings</h2>
				<label class="settings-row" for="language">
					<span id="language-label">Speech language</span>
					<select class="settings-select" id="language"></select>
				</label>
				<label class="settings-row" for="device-voice">
					<span class="settings-text">
						<span id="device-voice-label">Only the device voice</span>
						<span class="settings-note" id="device-voice-note">Nothing you type is sent to Google. The voice sounds less natural.</span>
					</span>
					<input class="settings-checkbox" id="device-voice" type="checkbox" />
				</label>
				<p class="settings-footer">
					<!-- main.js points this at the section in the interface language. -->
					<a class="settings-link" id="privacy-link" href="privacy.html">Privacy</a>
				</p>
			</section>
		</main>

		<!-- Shown full screen when speaking is not enough: noise, or someone
		     who cannot hear well. -->
		<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Shown text" hidden>
			<p class="overlay-text" id="overlay-text"></p>
			<div class="overlay-actions">
				<button class="overlay-speak" id="overlay-speak" type="button">Play</button>
				<button class="overlay-close" id="overlay-close" type="button">Close</button>
			</div>
		</div>

		<script src="main.js"></script>
	</body>
</html>
